<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring — Admin · Talentlytica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
  :root {
    --nm-bg: #ffffff; --nm-fg: #0f172a; --nm-card: #ffffff;
    --nm-border: #e2e8f0; --nm-muted: #f8fafc; --nm-muted-fg: #64748b;
    --nm-input: #e2e8f0; --nm-radius: 0.625rem;
  }
  html, body { height: 100%; margin: 0; }
  body { background: #fff; font-family: 'Inter',sans-serif; display: flex; height: 100vh; overflow: hidden; }

  .sidebar { width: 240px; flex-shrink: 0; background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: width .25s; }
  .sidebar.collapsed { width: 64px; }
  .sb-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,.1); flex-shrink: 0; }
  .sb-logo { display: flex; align-items: center; gap: 10px; }
  .sb-logo-icon { width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; }
  .sb-logo-text .t1 { font-size: 12px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .sb-logo-text .t2 { font-size: 10px; color: #94a3b8; white-space: nowrap; }
  .sb-collapse-btn { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: #94a3b8; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background .15s, color .15s; }
  .sb-collapse-btn:hover { background: #1e293b; color: #fff; }
  .sb-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sb-nav::-webkit-scrollbar { width: 4px; }
  .sb-nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  .sb-section { border-top: 1px solid rgba(255,255,255,.06); padding-top: 6px; margin-top: 4px; }
  .sb-section:first-child { border-top: none; margin-top: 0; }
  .sb-section-title { padding: 4px 12px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: color .15s; }
  .sb-section-title.dim-sect { color: #334155; }
  .sb-section-title.active-sect { color: #60a5fa; }
  .sb-section-dot { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; display: inline-block; margin-right: 5px; }
  .sb-chevron { font-size: 10px; transition: transform .2s; }
  .sb-chevron.open { transform: rotate(90deg); }
  .sb-items { overflow: hidden; }
  .sb-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 6px; margin: 1px 6px; border-left: 2px solid transparent; transition: background .12s, color .12s; text-decoration: none; white-space: nowrap; overflow: hidden; color: #94a3b8; background: none; border-top: none; border-right: none; border-bottom: none; font-family: inherit; width: calc(100% - 12px); text-align: left; }
  .sb-item .sb-icon { font-size: 15px; flex-shrink: 0; opacity: .7; }
  .sb-item.active-section { background: #3b82f6; color: #fff; border-left-color: transparent; }
  .sb-item.active-section .sb-icon { opacity: 1; }
  .sb-item.dim-link { color: #334155; cursor: default; }
  .sb-item:not(.dim-link):not(.active-section):hover { background: #1e293b; color: #e2e8f0; }
  .sidebar.collapsed .sb-logo-text, .sidebar.collapsed .sb-section-title span:not(.sb-section-dot),
  .sidebar.collapsed .sb-item span, .sidebar.collapsed .sb-chevron { display: none; }
  .sidebar.collapsed .sb-item { justify-content: center; padding: 8px; border-left: none; margin: 1px 4px; }
  .sidebar.collapsed .sb-section-title { justify-content: center; padding: 6px; }
  .sb-footer { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.1); font-size: 10px; color: #334155; flex-shrink: 0; }

  .main-area { flex: 1; overflow: auto; display: flex; flex-direction: column; min-width: 0; }
  .page-head { padding: 28px 28px 0; }
  .page-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--nm-fg); }
  .page-sub { font-size: 13px; color: var(--nm-muted-fg); margin-top: 4px; }
  main { padding: 0 28px 64px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0 0; }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .kpi-card { border-radius: var(--nm-radius); padding: 18px 18px 16px; display: flex; align-items: flex-start; justify-content: space-between; border: 1px solid transparent; }
  .kpi-inner p:first-child { font-size: 12px; font-weight: 600; opacity: .75; }
  .kpi-inner p:last-child  { font-size: 28px; font-weight: 700; margin-top: 6px; line-height: 1; }
  .kpi-card svg { width: 28px; height: 28px; flex-shrink: 0; opacity: .5; margin-top: 4px; }
  .kpi-blue  { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
  .kpi-green { background: #f0fdf4; color: #14532d; border-color: #bbf7d0; }
  .kpi-slate { background: #f8fafc; color: #334155; border-color: #e2e8f0; }
  .kpi-red   { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

  .filter-bar { background: #fff; border: 1px solid var(--nm-border); border-radius: var(--nm-radius); padding: 14px 16px; margin-top: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-label { font-size: 11px; font-weight: 500; color: var(--nm-muted-fg); }
  .toggle-group { display: flex; gap: 0; border: 1px solid var(--nm-border); border-radius: 6px; overflow: hidden; }
  .toggle-btn { padding: 5px 14px; font-size: 13px; font-weight: 500; cursor: pointer; background: #fff; color: #334155; border: none; font-family: inherit; transition: background .15s, color .15s; }
  .toggle-btn.active { background: #0f172a; color: #fff; }
  .toggle-btn:hover:not(.active) { background: #f1f5f9; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--nm-muted-fg); pointer-events: none; }
  .search-wrap input { padding: 7px 10px 7px 28px; border-radius: 6px; border: 1px solid var(--nm-border); font-family: inherit; font-size: 13px; background: var(--nm-bg); color: var(--nm-fg); width: 200px; }
  .search-wrap input:focus { outline: none; box-shadow: 0 0 0 2px #bfdbfe; }

  .muted { color: var(--nm-muted-fg); }
  .empty { text-align: center; color: var(--nm-muted-fg); padding: 32px; font-size: 13px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background .15s; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-primary { background: #0f172a; color: #fff; }
  .btn-primary:hover { background: #1e293b; }
  .btn-outline { background: #fff; color: var(--nm-fg); border: 1px solid var(--nm-border); }
  .btn-outline:hover { background: #f8fafc; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 64px 32px; border: 1px dashed var(--nm-border); border-radius: var(--nm-radius); margin-top: 16px; text-align: center; }
  .empty-state-icon { font-size: 40px; }
  .empty-state h2 { font-size: 16px; font-weight: 600; color: var(--nm-fg); margin: 0; }
  .empty-state p { font-size: 13px; color: var(--nm-muted-fg); margin: 0; max-width: 320px; }

  /* badge status scoring batch — konvensi sama dgn assignment.html (tab asesor) */
  .status-badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 9999px; padding: 2px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid; flex-shrink: 0; }
  .bd-green { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
  .bd-blue  { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
  .bd-slate { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }

  /* status validasi & status interview per kandidat */
  .sub-status { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; padding: 2px 8px; font-size: 10px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .vs-belum     { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; }
  .ss-assigned   { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
  .ss-invited    { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .ss-inprogress { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
  .ss-completed  { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
  .ss-expired    { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .ss-cancelled  { background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0; }

  /* avatar bulat berinisial asesor */
  .asesor-avatar { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; flex-shrink: 0; }

  /* ── header besar per-batch, collapsible ── */
  .orbid-batch { background: #fff; border: 1px solid var(--nm-border); border-radius: var(--nm-radius); margin-bottom: 14px; overflow: hidden; }
  .orbid-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; flex-wrap: wrap; }
  .orbid-head:hover { background: #f8fafc; }
  .orbid-chevron { display: inline-flex; color: #94a3b8; transition: transform .2s; flex-shrink: 0; }
  .orbid-chevron.open { transform: rotate(180deg); color: #3b82f6; }
  .orbid-name { font-size: 15px; font-weight: 700; color: var(--nm-fg); }
  .orbid-meta { font-size: 12px; color: var(--nm-muted-fg); margin-left: auto; white-space: nowrap; }
  .orbid-progress { display: flex; align-items: center; gap: 8px; width: 160px; flex-shrink: 0; }
  .orbid-progress-track { flex: 1; height: 8px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; }
  .orbid-progress-fill { height: 100%; border-radius: 9999px; transition: width .3s; }
  .orbid-progress-pct { font-size: 13px; font-weight: 700; color: var(--nm-fg); width: 40px; text-align: right; flex-shrink: 0; }

  .orbid-body { border-top: 1px solid var(--nm-border); }
  .orbid-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--nm-border); background: #f8fafc; }
  .orbid-toolbar-count { font-size: 13px; font-weight: 700; color: var(--nm-fg); margin-right: auto; }
  .orbid-select { border: 1px solid var(--nm-border); border-radius: 6px; padding: 6px 10px; font-family: inherit; font-size: 12px; background: #fff; color: var(--nm-fg); }
  .orbid-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .orbid-table th { text-align: left; padding: 10px 20px; font-size: 11px; font-weight: 600; color: var(--nm-muted-fg); border-bottom: 1px solid var(--nm-border); background: #fff; white-space: nowrap; }
  .orbid-table td { padding: 12px 20px; border-bottom: 1px solid var(--nm-border); vertical-align: middle; }
  .orbid-table tr:last-child td { border-bottom: 0; }
  .orbid-mini-prog { display: flex; align-items: center; gap: 6px; min-width: 90px; }
  .orbid-mini-track { flex: 1; height: 6px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; }
  .orbid-mini-fill { height: 100%; border-radius: 9999px; }
  .orbid-mini-pct { font-size: 11px; color: var(--nm-muted-fg); width: 32px; text-align: right; flex-shrink: 0; }

  @media (max-width: 700px) {
    .sidebar { width: 64px !important; }
    .sidebar .sb-logo-text, .sidebar .sb-section-title span:not(.sb-section-dot),
    .sidebar .sb-item span, .sidebar .sb-chevron { display: none !important; }
    .sidebar .sb-item { justify-content: center; padding: 8px; border-left: none; margin: 1px 4px; }
    .sidebar .sb-section-title { justify-content: center; padding: 6px; }
    .orbid-meta { margin-left: 0; width: 100%; order: 3; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <div class="sb-logo-icon">T</div>
      <div class="sb-logo-text"><div class="t1">Talentlytica</div><div class="t2">Admin Panel</div></div>
    </div>
    <button class="sb-collapse-btn" onclick="toggleSidebar()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">
      <div class="sb-section-title active-sect" onclick="toggleSection('s-assess')">
        <span><span class="sb-section-dot"></span>Assessment</span>
        <span class="sb-chevron open" id="chev-s-assess">▶</span>
      </div>
      <div class="sb-items" id="s-assess">
        <a class="sb-item" href="item-management.html">
          <svg class="sb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Item Management</span>
        </a>
        <a class="sb-item" href="item-management.html#paket">
          <svg class="sb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span>Paket Interview</span>
        </a>
        <a class="sb-item" href="assignment.html">
          <svg class="sb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Assignment</span>
        </a>
        <a class="sb-item active-section" href="monitoring.html">
          <svg class="sb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Monitoring</span>
        </a>
      </div>
    </div>
  </nav>
  <div class="sb-footer">v0.4 · prototype</div>
</aside>

<div class="main-area">
<div class="page-head">
  <div class="page-head-row">
    <div>
      <div class="page-title">Monitoring</div>
      <div class="page-sub">Pantau progres interview, siapa asesor yang menilai, dan status validasi — per batch</div>
    </div>
    <a href="assignment.html#asesor" class="btn btn-outline btn-sm" style="margin-top:4px;text-decoration:none;">+ Assign Asesor</a>
  </div>
</div>
<main>
  <div class="kpi-grid" id="mon-kpi" style="margin-top:16px;"></div>

  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Status Batch</span>
      <div class="toggle-group">
        <button class="toggle-btn active" data-filter="" onclick="setFilter(this)">Semua</button>
        <button class="toggle-btn" data-filter="active" onclick="setFilter(this)">Ada Progress</button>
        <button class="toggle-btn" data-filter="done" onclick="setFilter(this)">Selesai</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Cari Batch</span>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="b-q" placeholder="Nama batch atau paket…" oninput="renderAll()">
      </div>
    </div>
  </div>

  <div id="batch-list" style="margin-top:16px;"></div>

  <div style="margin-top:20px;text-align:right;">
    <button type="button" onclick="resetDemo()" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--nm-muted-fg);font-family:inherit;text-decoration:underline;">Reset data demo</button>
  </div>
</main>
</div>

<script src="../competency-data.js"></script>
<script src="assessor-data.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>AD.esc(s);
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function toggleSidebar(){$('sidebar').classList.toggle('collapsed');}
function toggleSection(id){const el=$(id),chev=$('chev-'+id);if(!el)return;const h=el.style.display==='none';el.style.display=h?'':'none';if(chev)chev.classList.toggle('open',h);}

/* ── KPI ── */
const KPI_ICONS={
  paket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>',
  peserta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>',
};
function renderKPI(){
  const all=AD.readCandidates();
  const batchAktif=AD.batches().length;
  const completed=all.filter(a=>a.status==='Completed').length;
  const inprog=all.filter(a=>['Started','In Progress'].includes(a.status)).length;
  const stats=[
    {label:'Batch Aktif',n:batchAktif,color:'kpi-slate',icon:'paket'},
    {label:'Total Peserta',n:all.length,color:'kpi-blue',icon:'peserta'},
    {label:'Selesai',n:completed,color:'kpi-green',icon:'done'},
    {label:'On Progress',n:inprog,color:'kpi-blue',icon:'progress'},
  ];
  $('mon-kpi').innerHTML=stats.map(s=>`<div class="kpi-card ${s.color}"><div class="kpi-inner"><p>${s.label}</p><p>${s.n}</p></div>${KPI_ICONS[s.icon]}</div>`).join('');
}

/* ── filter level-batch (Semua/Ada Progress/Selesai + cari) ── */
let activeFilter='';
function setFilter(btn){document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;renderAll();}

function progColor(pct){if(pct===0)return'#f87171';if(pct<50)return'#fbbf24';if(pct<75)return'#60a5fa';return'#34d399';}

/* status interview kandidat (Invited: sudah diundang tapi belum masuk
   platform interview; Started/In Progress: sedang mengerjakan; Completed: selesai) */
function subStatus(s){const map={Assigned:'ss-assigned',Invited:'ss-invited',Started:'ss-inprogress','In Progress':'ss-inprogress',Completed:'ss-completed',Expired:'ss-expired',Cancelled:'ss-cancelled'};return`<span class="sub-status ${map[s]||'ss-assigned'}">${esc(s)}</span>`;}

/* status validasi per kandidat — disederhanakan jadi 3 kondisi + "belum
   ditugaskan", biar seragam dgn kolom Interview: yang perlu dicek cuma
   selesai atau belum, bukan tahapan internal proses asesor.
   Sedang Direview -> In Progress; Tervalidasi & Direvisi -> Completed. */
function validasiStatusOf(task){
  if(!task)return'Belum Ditugaskan';
  if(AD.DONE_STATUS.includes(task.status))return'Completed';
  if(task.status===AD.TASK_STATUS.REVIEW)return'In Progress';
  return'Menunggu';
}
const VS_CLASS={'Belum Ditugaskan':'vs-belum','Menunggu':'ss-assigned','In Progress':'ss-inprogress','Completed':'ss-completed'};
function validasiBadge(task){
  const label=validasiStatusOf(task);
  return`<span class="sub-status ${VS_CLASS[label]}">${esc(label)}</span>`;
}
/* avatar bulat berinisial */
const AVATARBG=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899'];
function avatarBg(name){let h=0;for(const c of(name||''))h=(h*31+c.charCodeAt(0))&0xffffffff;return AVATARBG[Math.abs(h)%AVATARBG.length];}
function initials(name){const p=(name||'').trim().split(/\s+/);return(p[0]?.[0]||'')+(p[1]?.[0]||'');}

/* kolom "Asesor" — dipisah dari status validasi biar tabel lebih rapi */
function asesorCell(task){
  if(!task)return'<span class="muted">–</span>';
  return`<div style="display:flex;align-items:center;gap:8px;">
    <span class="asesor-avatar" style="background:${avatarBg(task.assessorName)};">${esc(initials(task.assessorName))}</span>
    <span style="font-size:12px;font-weight:600;color:var(--nm-fg);">${esc(task.assessorName)}</span>
  </div>`;
}
const SCORING_BADGE_CLASS={};
SCORING_BADGE_CLASS[AD.SCORING.BELUM_SIAP]='bd-slate';
SCORING_BADGE_CLASS[AD.SCORING.BELUM]='bd-slate';
SCORING_BADGE_CLASS[AD.SCORING.SEDANG]='bd-blue';
SCORING_BADGE_CLASS[AD.SCORING.SELESAI]='bd-green';

/* label tampilan status scoring — "Belum Siap" (report AI belum ada) ditampilkan
   sbg "Belum Discoring" juga: dari sisi monitoring keduanya sama2 berarti batch
   belum discoring, bedanya cuma kenapa. Cuma ganti teksnya, bukan AD.SCORING —
   value aslinya masih dipakai untuk urutan kartu di assessor-data.js. */
const SCORING_LABEL={}; SCORING_LABEL[AD.SCORING.BELUM_SIAP]='Belum Discoring';
function scoringLabel(status){ return SCORING_LABEL[status]||status; }

/* progres individual: 0% belum interview, 50% interview selesai tapi
   belum tervalidasi asesor, 100% sudah tervalidasi/direvisi */
function personPct(cand,task){
  if(cand.status!=='Completed')return 0;
  if(task&&AD.DONE_STATUS.includes(task.status))return 100;
  return 50;
}

/* satu baris peserta — dipakai baik oleh render awal (batchCardHtml)
   maupun render ulang saat search/filter per-kartu (renderCardTable),
   supaya template-nya tidak dobel dan tidak gampang divergen. */
function personRowHtml(c,t){
  const pct=personPct(c,t);
  return`<tr>
    <td><b>${esc(c.nama)}</b><br><span class="muted" style="font-size:11px;">${esc(c.email||'–')}</span></td>
    <td>${subStatus(c.status)}</td>
    <td>${asesorCell(t)}</td>
    <td>${validasiBadge(t)}</td>
    <td>
      <div class="orbid-mini-prog">
        <div class="orbid-mini-track"><div class="orbid-mini-fill" style="width:${pct}%;background:${progColor(pct)};"></div></div>
        <span class="orbid-mini-pct">${pct}%</span>
      </div>
    </td>
  </tr>`;
}
function rowsHtmlFor(cands,taskByCand){
  return cands.length?cands.map(c=>personRowHtml(c,taskByCand[c.id])).join(''):'<tr><td colspan="5" class="empty">Tidak ada peserta yang cocok dengan filter.</td></tr>';
}

/* ── per-kartu: pencarian & filter status peserta (state per batchId) ── */
let expanded=new Set();
const cardFilters={};

function toggleBatch(id){
  if(expanded.has(id))expanded.delete(id);else expanded.add(id);
  renderAll();
}

function cardRows(r){
  const taskByCand={};
  r.tasks.forEach(t=>{taskByCand[t.candidateId]=t;});
  const f=cardFilters[r.id]||{q:'',status:''};
  let cands=r.candidates;
  if(f.q){
    const q=f.q.toLowerCase();
    cands=cands.filter(c=>c.nama.toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q));
  }
  if(f.status){
    cands=cands.filter(c=>validasiStatusOf(taskByCand[c.id])===f.status);
  }
  return{taskByCand,cands,f};
}

function renderCardTable(r){
  const{taskByCand,cands}=cardRows(r);
  const cnt=$('cnt-'+r.id), tbl=$('tbl-'+r.id);
  if(!cnt||!tbl)return;
  cnt.textContent=`Peserta — ${cands.length} ditampilkan`;
  tbl.innerHTML=rowsHtmlFor(cands,taskByCand);
}

function setCardSearch(id,val){cardFilters[id]=Object.assign({},cardFilters[id]||{},{q:val});const r=AD.batchRows().find(x=>x.id===id);if(r)renderCardTable(r);}
function setCardStatusFilter(id,val){cardFilters[id]=Object.assign({},cardFilters[id]||{},{status:val});const r=AD.batchRows().find(x=>x.id===id);if(r)renderCardTable(r);}

function batchCardHtml(r){
  const isOpen=expanded.has(r.id);
  const badgeCls=SCORING_BADGE_CLASS[r.scoringStatus]||'bd-slate';
  const{taskByCand,cands,f}=cardRows(r);

  // progres keseluruhan batch = kandidat yang sudah TUNTAS end-to-end
  // (interview selesai + tervalidasi/direvisi) dibagi total kandidat.
  const overallDone=r.candidates.filter(c=>{const t=taskByCand[c.id];return t&&AD.DONE_STATUS.includes(t.status);}).length;
  const overallPct=r.total?Math.round(overallDone/r.total*100):0;

  const rowsHtml=rowsHtmlFor(cands,taskByCand);

  const STATUS_OPTS=['','Belum Ditugaskan','Menunggu','In Progress','Completed'];

  return`<div class="orbid-batch">
    <div class="orbid-head" onclick="toggleBatch('${jsq(r.id)}')">
      <span class="orbid-chevron ${isOpen?'open':''}"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg></span>
      <span class="orbid-name">${esc(r.batchName)}</span>
      <span class="status-badge ${badgeCls}">${esc(scoringLabel(r.scoringStatus))}</span>
      <span class="orbid-meta">${esc(AD.fmtDate(r.periodStart))} – ${esc(AD.fmtDate(r.periodEnd))} · ${r.total} peserta</span>
      <div class="orbid-progress">
        <div class="orbid-progress-track"><div class="orbid-progress-fill" style="width:${overallPct}%;background:${progColor(overallPct)};"></div></div>
        <span class="orbid-progress-pct">${overallPct}%</span>
      </div>
    </div>
    <div class="orbid-body" ${isOpen?'':'hidden'}>
      <div class="orbid-toolbar">
        <span class="orbid-toolbar-count" id="cnt-${r.id}">Peserta — ${cands.length} ditampilkan</span>
        <select class="orbid-select" onchange="setCardStatusFilter('${jsq(r.id)}', this.value)">
          ${STATUS_OPTS.map(s=>`<option value="${esc(s)}" ${f.status===s?'selected':''}>${s?esc(s):'Semua status'}</option>`).join('')}
        </select>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" placeholder="Cari nama…" value="${esc(f.q)}" oninput="setCardSearch('${jsq(r.id)}', this.value)">
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="orbid-table">
          <thead><tr><th>Peserta</th><th>Interview</th><th>Asesor</th><th>Status Validasi</th><th>Progres</th></tr></thead>
          <tbody id="tbl-${r.id}">${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function renderAll(){
  const bq=($('b-q').value||'').toLowerCase();
  let rows=AD.batchRows();
  if(bq)rows=rows.filter(r=>r.batchName.toLowerCase().includes(bq)||r.paketName.toLowerCase().includes(bq));
  if(activeFilter==='active')rows=rows.filter(r=>r.candidates.some(a=>!['Completed','Expired','Cancelled'].includes(a.status)));
  if(activeFilter==='done')rows=rows.filter(r=>r.candidates.length>0&&r.candidates.every(a=>a.status==='Completed'));

  const list=$('batch-list');
  if(!rows.length&&!AD.readCandidates().length){
    list.innerHTML=`<div class="empty-state"><div class="empty-state-icon">📊</div><h2>Belum ada data monitoring</h2><p>Buat assignment terlebih dahulu untuk mulai memantau progres.</p><a href="assignment.html" class="btn btn-primary btn-sm" style="text-decoration:none;">+ Buat Assignment</a></div>`;
    return;
  }
  if(!rows.length){
    list.innerHTML=`<div class="empty" style="border:1px solid var(--nm-border);border-radius:var(--nm-radius);background:#fff;">Tidak ada batch ditemukan.</div>`;
    return;
  }
  list.innerHTML=rows.map(r=>batchCardHtml(r)).join('');
}

/* toast + reset demo */
function showToast(msg){
  let t=$('toast-msg');
  if(!t){t=document.createElement('div');t.id='toast-msg';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;pointer-events:none;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>{t.style.opacity='0';},2000);
}
function resetDemo(){AD.resetDemo();AD.ensureData();expanded.clear();renderKPI();renderAll();showToast('Data demo direset');}

AD.ensureData();renderKPI();renderAll();
</script>
</body>
</html>
